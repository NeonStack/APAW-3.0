name: Scheduled Automated Flood Detection

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *' # 7:30 AM PH
    - cron: '30 5 * * *' # 1:30 PM PH
    - cron: '30 11 * * *' # 7:30 PM PH

jobs:
  trigger-automated-flood-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Automated Flood Detection Webhook
        env:
          TARGET_URL: ${{ secrets.AUTOMATED_FLOOD_WEBHOOK_URL }}
          JOB_SECRET: ${{ secrets.JOB_TRIGGER_SECRET }}
        run: |
          set -euo pipefail

          echo "Triggering: ${TARGET_URL}"

          HTTP_CODE=$(curl --silent --show-error --location \
            --max-time 240 \
            --retry 2 \
            --retry-delay 3 \
            --write-out "%{http_code}" \
            --output response_body.json \
            --request POST \
            --header "Authorization: Bearer ${JOB_SECRET}" \
            --header "Content-Type: application/json" \
            --header "User-Agent: github-actions-webhook" \
            --data '{"trigger_source":"github-actions"}' \
            "${TARGET_URL}")

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response preview:" && head -c 800 response_body.json && echo

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "Webhook failed with non-2xx status."
            exit 1
          fi
